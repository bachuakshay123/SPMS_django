{% extends 'base.html' %}
{% block content %}

<div class="row g-3">
            
            <div class="container-fluid mt-4">
                <div class="card">
                    <div class="card-header d-flex gap-2">
                        <i class="bi bi-gear"></i>
                        Change Your Password
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}
                            {% for message in messages %}
                            <div class="alert alert-info">
                                {{ message }}
                            </div>
                            {% endfor %}
                            <div class="mb-3">
                                <label class="form-label">
                                    Current Password
                                </label>
                                {{ form.current_password }}
                            </div>
                            <div class="mb-3">
                                <label class="form-label">
                                    New Password
                                </label>
                                {{ form.new_password }}
                            </div>
                            <div class="mb-3">
                                <label class="form-label">
                                    Re-Enter Password
                                </label>
                                {{ form.confirm_password }}
                            </div>
                            <div>
                                <button type="submit"class="btn btn-primary w-100">
                                    Change Password
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
{% endblock %}
